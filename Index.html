<!DOCTYPE html>
<html>
<head>
    <title>Game Ratio Calculator</title>
</head>
<body>
    <h1>Ratio Calculator</h1>

    <label>Input A:</label>
    <input id="a" type="number"><br><br>

    <label>Input B:</label>
    <input id="b" type="number"><br><br>

    <button onclick="calculate()">Calculate Ratio</button>

    <h2 id="result"></h2>

    <script>
        function calculate() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);

            if (b === 0) {
                document.getElementById("result").innerText = "Can't divide by zero!";
                return;
            }

            let ratio = a / b;
            document.getElementById("result").innerText = "Ratio = " + ratio.toFixed(2);
        }
    </script>
</body>
</html>
